<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>

  <link rel="stylesheet" href="style/login-sucess.css"/>
</head>

<body>

<nav class="navbar">

  <div class="logo">
    UserApp
  </div>

  <div class="nav-links">
    <a href="#">Dashboard</a>
    <a href="#">Profile</a>
    <a href="#">Settings</a>

    <form action="logout" method="post">
      <button type="submit">Logout</button>
    </form>
  </div>

</nav>


<main class="dashboard">

  <section class="welcome">
    <h1>Welcome back! 👋</h1>
    <p>Here's what's happening with your account.</p>
  </section>


  <section class="cards">

    <div class="card">
      <h3>Profile</h3>
      <p>Your profile is active.</p>
    </div>

    <div class="card">
      <h3>Account Status</h3>
      <p>✓ Account verified</p>
    </div>

    <div class="card">
      <h3>Last Login</h3>
      <p>Just now</p>
    </div>

  </section>


  <section class="activity">

    <h2>Recent Activity</h2>

    <div class="activity-item">
      <span>Logged into your account</span>
      <small>Just now</small>
    </div>

    <div class="activity-item">
      <span>Profile created</span>
      <small>Today</small>
    </div>

  </section>

</main>

</body>
</html>
